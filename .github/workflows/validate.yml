name: Validate application

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for application files
        id: source
        run: |
          if [ -f index.html ] && [ -f requirements-dev.txt ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Application files not uploaded yet — skipping source tests."
          fi
      - uses: actions/setup-python@v5
        if: steps.source.outputs.ready == 'true'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: steps.source.outputs.ready == 'true'
        with:
          node-version: '22'
      - name: Install test dependencies
        if: steps.source.outputs.ready == 'true'
        run: python -m pip install -r requirements-dev.txt
      - name: Validate files
        if: steps.source.outputs.ready == 'true'
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate JavaScript
        if: steps.source.outputs.ready == 'true'
        run: node --check search-worker.js && node --check pwa.js && node --check sw.js && node tests/test_search_worker.cjs
